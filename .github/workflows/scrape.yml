name: scraper-diario

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scraper-diario
  cancel-in-progress: false

jobs:
  correr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scrapear
        run: python -u -m scraper.main
      - name: Guardar resultados
        run: |
          git config user.name  "scraper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "avisos $(date -u +%F)"
            git push
          fi

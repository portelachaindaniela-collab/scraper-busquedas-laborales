<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Búsquedas laborales</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --border: #e3e6ea; --text: #1a1d21;
    --muted: #656d76; --accent: #2557d6; --ok: #1a7f37; --warn: #9a6700; --err: #cf222e;
    --chip: #eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --card: #161b22; --border: #2b313a; --text: #e6edf3;
      --muted: #9198a1; --accent: #4f8cff; --ok: #3fb950; --warn: #d29922; --err: #f85149;
      --chip: #21262d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .estado { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
  .pill {
    font-size: 12px; padding: 3px 9px; border-radius: 999px;
    background: var(--chip); border: 1px solid var(--border); color: var(--muted);
  }
  .pill.ok    { color: var(--ok); }
  .pill.parcial { color: var(--warn); }
  .pill.error { color: var(--err); }
  .controles { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  input[type="search"], select {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--card); color: var(--text); font-size: 14px;
  }
  input[type="search"] { flex: 1 1 200px; }
  .lista { display: flex; flex-direction: column; gap: 10px; }
  .aviso {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px;
  }
  .aviso h2 { font-size: 16px; margin: 0 0 4px; }
  .aviso h2 a { color: var(--accent); text-decoration: none; }
  .aviso h2 a:hover { text-decoration: underline; }
  .meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .badges { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--chip); }
  .desc { margin-top: 10px; font-size: 13px; color: var(--muted); }
  .desc[hidden] { display: none; }
  .toggle { margin-top: 8px; font-size: 12px; color: var(--accent); cursor: pointer; background: none; border: 0; padding: 0; }
  .vacio { color: var(--muted); text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Búsquedas laborales</h1>
  <div class="sub" id="sub">Cargando…</div>
  <div class="estado" id="estado"></div>

  <div class="controles">
    <input type="search" id="q" placeholder="Filtrar por texto (título, empresa)…">
    <select id="portal"><option value="">Todos los portales</option></select>
    <select id="modalidad">
      <option value="">Cualquier modalidad</option>
      <option value="remoto">Remoto</option>
      <option value="hibrido">Híbrido</option>
      <option value="presencial">Presencial</option>
    </select>
  </div>

  <div class="lista" id="lista"></div>
</div>

<script>
const fmtFecha = iso => {
  if (!iso) return "sin fecha";
  const d = new Date(iso);
  if (isNaN(d)) return "sin fecha";
  const diff = (Date.now() - d) / 36e5;
  if (diff < 1) return "hace menos de 1 h";
  if (diff < 24) return `hace ${Math.round(diff)} h`;
  const dias = Math.round(diff / 24);
  return dias === 1 ? "ayer" : `hace ${dias} días`;
};
const esc = s => (s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let avisos = [];

function pintarEstado(run) {
  const cont = document.getElementById("estado");
  const sub = document.getElementById("sub");
  if (!run || !run.fin) { sub.textContent = ""; return; }
  const cuando = new Date(run.fin).toLocaleString("es-AR", { dateStyle: "medium", timeStyle: "short" });
  sub.textContent = `${run.publicados} avisos · ventana ${run.ventana_horas} h · última corrida ${cuando}`;
  cont.innerHTML = Object.entries(run.portales || {}).map(([nombre, info]) => {
    const cls = info.estado === "ok" ? "ok" : info.estado === "parcial" ? "parcial" : "error";
    return `<span class="pill ${cls}" title="${esc((info.errores || []).join(' | '))}">${nombre}: ${info.estado} (${info.encontrados})</span>`;
  }).join("");
}

function pintarLista() {
  const q = document.getElementById("q").value.toLowerCase().trim();
  const portal = document.getElementById("portal").value;
  const modalidad = document.getElementById("modalidad").value;
  const lista = document.getElementById("lista");

  const filtrados = avisos.filter(a => {
    if (portal && a.portal !== portal) return false;
    if (modalidad && a.modalidad !== modalidad) return false;
    if (q && !(`${a.titulo} ${a.empresa || ""} ${a.ubicacion || ""}`.toLowerCase().includes(q))) return false;
    return true;
  });

  if (!filtrados.length) {
    lista.innerHTML = `<div class="vacio">Nada para mostrar todavía.</div>`;
    return;
  }

  lista.innerHTML = filtrados.map((a, i) => `
    <div class="aviso">
      <h2><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.titulo)}</a></h2>
      <div class="meta">
        <span>${esc(a.empresa || "empresa no informada")}</span>
        <span>·</span>
        <span>${esc(a.ubicacion || "ubicación no informada")}</span>
        <span>·</span>
        <span>${fmtFecha(a.fecha_publicacion)}</span>
      </div>
      <div class="badges">
        <span class="badge">${esc(a.portal)}</span>
        ${a.modalidad ? `<span class="badge">${esc(a.modalidad)}</span>` : ""}
        ${a.salario ? `<span class="badge">${esc(a.salario)}</span>` : ""}
      </div>
      ${a.descripcion ? `
        <button class="toggle" data-i="${i}">Ver descripción</button>
        <div class="desc" id="desc-${i}" hidden>${esc(a.descripcion.slice(0, 1200))}${a.descripcion.length > 1200 ? "…" : ""}</div>
      ` : ""}
    </div>
  `).join("");

  lista.querySelectorAll(".toggle").forEach(btn => {
    btn.onclick = () => {
      const d = document.getElementById("desc-" + btn.dataset.i);
      d.hidden = !d.hidden;
      btn.textContent = d.hidden ? "Ver descripción" : "Ocultar descripción";
    };
  });
}

Promise.all([
  fetch("avisos.json").then(r => r.json()).catch(() => []),
  fetch("ultima_corrida.json").then(r => r.json()).catch(() => null),
]).then(([datos, run]) => {
  avisos = Array.isArray(datos) ? datos : [];
  const portales = [...new Set(avisos.map(a => a.portal))].sort();
  document.getElementById("portal").insertAdjacentHTML(
    "beforeend", portales.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join(""));
  pintarEstado(run);
  pintarLista();
  if (!run || !run.fin) document.getElementById("sub").textContent = `${avisos.length} avisos`;
});

["q", "portal", "modalidad"].forEach(id =>
  document.getElementById(id).addEventListener("input", pintarLista));
</script>
</body>
</html>
